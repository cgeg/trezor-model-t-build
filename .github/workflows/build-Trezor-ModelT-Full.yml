name: Build Trezor Model T Development Suite

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Ensure Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            connect-timeout = 30
            stalled-download-timeout = 120
            max-jobs = auto
            cores = 2
            fallback = true

      - name: Check Nix & Cache Connectivity
        run: |
          echo "=== Nix Version ==="
          nix --version
          echo "=== Nix Cache Configuration ==="
          nix show-config | grep -E 'substituters|trusted-public-keys'
          echo "=== Testing Cache Connectivity ==="
          curl -I --retry 5 --retry-delay 5 https://nixos.org
          curl -I --retry 5 --retry-delay 5 https://cachix.org
          echo "=== Disk Space & Memory ==="
          df -h
          free -h

      - name: Build & Sign Model T Development Suite
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Starting Trezor Model T Build ==="
          
          # 加入重試機制，避免暫時性網路波動導致快取下載中斷
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt to enter nix-shell and build ==="
            if nix-shell --show-trace --run '
              set -euo pipefail
              echo "=== Boardloader: Development ==="
              uv run xtask build boardloader -m t2t1 --bootloader-devel

              echo "=== Bootloader: Development ==="
              uv run xtask build bootloader -m t2t1 --bootloader-devel

              echo "=== Firmware: Development ==="
              uv run xtask build firmware -m t2t1 --bootloader-devel

              echo "=== Signing Firmware with Development Keys ==="
              cp core/build/artifacts/T2T1/firmware.bin core/build/artifacts/T2T1/firmware-unsigned.bin
              if uv run trezorctl --version >/dev/null 2>&1; then
                uv run trezorctl firmware sign --devel core/build/artifacts/T2T1/firmware.bin
              else
                trezorctl firmware sign --devel core/build/artifacts/T2T1/firmware.bin
              fi

              echo "=== All Builds & Signing Completed ==="
            ' 2>&1 | tee build.log; then
              break
            else
              echo "Attempt $attempt failed. Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

      - name: Collect & Verify Binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="core/build/artifacts/T2T1"
          mkdir -p dist/boardloader
          mkdir -p dist/bootloader
          mkdir -p dist/firmware

          echo "=== Checking Build Artifacts ==="
          if [ ! -d "$SRC" ]; then
            echo "ERROR: Artifact directory not found: $SRC"
            find core/build -type f -name '*.bin' || true
            exit 1
          fi

          for file in boardloader bootloader firmware firmware-unsigned; do
            if [ ! -s "$SRC/$file.bin" ]; then
              echo "ERROR: Missing binary: $SRC/$file.bin"
              find core/build -type f -name '*.bin' || true
              exit 1
            fi
          done

          cp "$SRC/boardloader.bin" dist/boardloader/
          cp "$SRC/bootloader.bin" dist/bootloader/
          cp "$SRC/firmware.bin" dist/firmware/
          cp "$SRC/firmware-unsigned.bin" dist/firmware/

          echo "=== Generated Binaries ==="
          ls -lhR dist/

          echo "=== SHA256 Checksums ==="
          sha256sum \
            dist/boardloader/boardloader.bin \
            dist/bootloader/bootloader.bin \
            dist/firmware/firmware.bin \
            dist/firmware/firmware-unsigned.bin \
            | tee dist/SHA256SUMS.txt

          echo "=== Build Verification Completed ==="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-development-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
