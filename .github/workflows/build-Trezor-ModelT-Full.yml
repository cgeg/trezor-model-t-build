name: Build Trezor Model T Development Suite (No-Sig Test)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Ensure Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Patch Bootloader to Ignore Signature
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Patching Bootloader Signature Verification ==="
          python3 -c '
          import glob, re

          # 搜尋 bootloader 與相關共用模組中的簽章與標頭驗證函式
          target_files = glob.glob("core/embed/**/*.c", recursive=True)
          patched_count = 0

          for filepath in target_files:
              if "bootloader" not in filepath and "image" not in filepath and "check" not in filepath:
                  continue
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              new_content = content
              # 1. 讓 check_firmware_header 或類似的標頭簽章驗證直接回傳 sectrue / true
              new_content = re.sub(
                  r"(secbool\s+(?:check_firmware_header|verify_firmware|firmware_verify|check_image_header)\s*\([^)]*\)\s*\{)",
                  r"\1 return sectrue;",
                  new_content
              )
              # 2. 讓簽章比對底層函式 (如 secp256r1_verify / ed25519_sign_open) 在 bootloader 專案中直接通過
              if "bootloader" in filepath:
                  new_content = re.sub(
                      r"(secbool\s+[a-zA-Z0-9_]*verify[a-zA-Z0-9_]*\s*\([^)]*\)\s*\{)",
                      r"\1 return sectrue;",
                      new_content
                  )

              if new_content != content:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Patched: {filepath}")
                  patched_count += 1

          print(f"Total files patched: {patched_count}")
          if patched_count == 0:
              print("WARNING: No files matched regex, listing bootloader files for inspection:")
              for f in glob.glob("core/embed/projects/bootloader/**/*.c", recursive=True):
                  print(" -", f)
          '

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://nixos.org https://cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            connect-timeout = 30
            stalled-download-timeout = 120
            max-jobs = auto
            cores = 2
            fallback = true

      - name: Check Nix & Cache Connectivity
        run: |
          echo "=== Nix Version ==="
          nix --version
          curl -I --retry 5 --retry-delay 5 https://nixos.org/nix-cache-info
          curl -I --retry 5 --retry-delay 5 https://cachix.org/nix-cache-info

      - name: Build Model T Development Suite (No-Sig)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Starting Trezor Model T Build ==="
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt to enter nix-shell and build ==="
            if nix-shell --show-trace --run '
              set -euo pipefail
              echo "=== Boardloader: Development ==="
              uv run xtask build boardloader -m t2t1 --bootloader-devel

              echo "=== Bootloader: Development ==="
              uv run xtask build bootloader -m t2t1 --bootloader-devel

              echo "=== Firmware: Development ==="
              uv run xtask build firmware -m t2t1 --bootloader-devel

              echo "=== All Builds Completed ==="
            ' 2>&1 | tee build.log; then
              break
            else
              echo "Attempt $attempt failed. Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

      - name: Collect & Verify Binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="core/build/artifacts/T2T1"
          mkdir -p dist/boardloader
          mkdir -p dist/bootloader
          mkdir -p dist/firmware

          for file in boardloader bootloader firmware; do
            if [ ! -s "$SRC/$file.bin" ]; then
              echo "ERROR: Missing binary: $SRC/$file.bin"
              exit 1
            fi
          done

          cp "$SRC/boardloader.bin" dist/boardloader/
          cp "$SRC/bootloader.bin" dist/bootloader/
          cp "$SRC/firmware.bin" dist/firmware/

          ls -lhR dist/
          sha256sum \
            dist/boardloader/boardloader.bin \
            dist/bootloader/bootloader.bin \
            dist/firmware/firmware.bin \
            | tee dist/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-nosig-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
