name: Build Trezor Model T Development Suite (Docker No-Sig)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Ensure Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Inspect & Patch Bootloader Signature Check
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Searching Bootloader Verification Functions ==="
          grep -rn "verify\|signature\|check_firmware\|vendor" core/embed/projects/bootloader/ || true

          python3 -c '
          import glob, re

          bl_files = glob.glob("core/embed/projects/bootloader/**/*.c", recursive=True)
          patched = 0

          for filepath in bl_files:
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              new_content = content
              new_content = re.sub(
                  r"if\s*\(\s*sectrue\s*!=\s*(check_[a-zA-Z0-9_]+|verify_[a-zA-Z0-9_]+)\s*\(",
                  r"if (secfalse == sectrue && sectrue != \1(",
                  new_content
              )
              new_content = re.sub(
                  r"if\s*\(\s*!\s*(check_[a-zA-Z0-9_]+|verify_[a-zA-Z0-9_]+)\s*\(",
                  r"if (0 && !\1(",
                  new_content
              )

              if new_content != content:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Safely patched condition in: {filepath}")
                  patched += 1

          print(f"Total bootloader files patched: {patched}")
          '

      - name: Build Model T Development Suite via Official Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Checking build-docker.sh ==="
          ls -la build-docker.sh

          # 使用 Trezor 官方提供的 Docker 映像檔直接編譯，完全避開 Nix 快取問題
          ./build-docker.sh --skip-core --skip-legacy --models T2T1 --no-init || true

          # 直接使用官方 Docker 映像執行 xtask 精準編譯開發版套件
          IMAGE=$(grep -E 'IMAGE=' build-docker.sh | head -n 1 | cut -d'=' -f2 | tr -d '"'\''')
          if [ -z "$IMAGE" ]; then
            IMAGE="ghcr.io/trezor/trezor-firmware-env.nix:latest"
          fi
          echo "Using Docker Image: $IMAGE"

          docker run --rm -v "$(pwd):/repo" -w /repo "$IMAGE" bash -c '
            set -euo pipefail
            echo "=== Boardloader: Development ==="
            uv run xtask build boardloader -m t2t1 --bootloader-devel

            echo "=== Bootloader: Development (No-Sig Patched) ==="
            uv run xtask build bootloader -m t2t1 --bootloader-devel

            echo "=== Firmware: Development ==="
            uv run xtask build firmware -m t2t1 --bootloader-devel

            echo "=== All Docker Builds Completed ==="
          ' 2>&1 | tee build.log

      - name: Collect & Verify Binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="core/build/artifacts/T2T1"
          mkdir -p dist/boardloader
          mkdir -p dist/bootloader
          mkdir -p dist/firmware

          for file in boardloader bootloader firmware; do
            if [ ! -s "$SRC/$file.bin" ]; then
              echo "ERROR: Missing binary: $SRC/$file.bin"
              tail -n 50 build.log || true
              exit 1
            fi
          done

          cp "$SRC/boardloader.bin" dist/boardloader/
          cp "$SRC/bootloader.bin" dist/bootloader/
          cp "$SRC/firmware.bin" dist/firmware/

          ls -lhR dist/
          sha256sum \
            dist/boardloader/boardloader.bin \
            dist/bootloader/bootloader.bin \
            dist/firmware/firmware.bin \
            | tee dist/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-nosig-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
