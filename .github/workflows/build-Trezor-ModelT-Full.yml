name: Build Trezor Model T Full Suite (Fast & Non-Production)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive

      - name: Ensure Submodules
        run: git submodule update --init --recursive --force

      - name: Build Full Suite via Official Docker (Non-Production)
        run: |
          set -e
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            -e PRODUCTION=0 \
            -e TREZOR_MODEL=T2T1 \
            ghcr.io/trezor/trezor-firmware-env.nix:latest \
            nix-shell --run "
              set -e
              export PRODUCTION=0
              uv run xtask build boardloader -m t2t1
              uv run xtask build bootloader -m t2t1
              uv run xtask build firmware -m t2t1
            "

      - name: Collect & Verify All Binaries
        run: |
          mkdir -p dist/boardloader dist/bootloader dist/firmware
          find core/build* -type f -name 'boardloader-T2T1*.bin' -exec cp {} dist/boardloader/ \;
          find core/build* -type f -name 'bootloader-T2T1*.bin' -exec cp {} dist/bootloader/ \;
          find core/build* -type f -name 'trezor-T2T1*.bin' -exec cp {} dist/firmware/ \;
          echo "=== 產出的所有非生產模式檔案 ==="
          ls -lhR dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-dev-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14
