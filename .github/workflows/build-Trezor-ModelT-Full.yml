name: Build Trezor Model T Dev Suite (Verified Dev Keys)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive

      - name: Ensure Submodules
        run: git submodule update --init --recursive --force

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Build & Dev-Sign Model T Suite
        run: |
          set -euo pipefail
          nix-shell --run '
            set -euo pipefail
            export PRODUCTION=0
            export TREZOR_MODEL=T2T1

            echo "=== 檢查 xtask build 可用參數 ==="
            uv run xtask build --help

            echo "=== 1. Build Boardloader (PRODUCTION=0, Dev Public Keys) ==="
            uv run xtask build boardloader -m t2t1

            echo "=== 2. Build Bootloader & Firmware (PRODUCTION=0) ==="
            uv run xtask build bootloader -m t2t1
            uv run xtask build firmware -m t2t1

            echo "=== 3. Inspect & Sign Headers ==="
            SRC="core/build/artifacts/T2T1"
            PYTHONPATH=core/tools uv run python -m trezor_core_tools.headertool --help
            PYTHONPATH=core/tools uv run python -m trezor_core_tools.headertool -D "$SRC/bootloader.bin"
            PYTHONPATH=core/tools uv run python -m trezor_core_tools.headertool -D "$SRC/firmware.bin"

            echo "=== 4. Verify Bootloader & Firmware Headers ==="
            PYTHONPATH=core/tools uv run python -m trezor_core_tools.headertool "$SRC/bootloader.bin"
            PYTHONPATH=core/tools uv run python -m trezor_core_tools.headertool "$SRC/firmware.bin"
          '

      - name: Collect & Verify Binaries
        run: |
          set -euo pipefail
          SRC="core/build/artifacts/T2T1"
          mkdir -p dist/boardloader dist/bootloader dist/firmware
          for file in boardloader bootloader firmware; do
            if [ ! -s "$SRC/$file.bin" ]; then
              echo "ERROR: Missing binary: $SRC/$file.bin"
              exit 1
            fi
          done
          cp "$SRC/boardloader.bin" dist/boardloader/
          cp "$SRC/bootloader.bin" dist/bootloader/
          cp "$SRC/firmware.bin" dist/firmware/

          ls -lhR dist/
          sha256sum \
            dist/boardloader/boardloader.bin \
            dist/bootloader/bootloader.bin \
            dist/firmware/firmware.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-dev-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14
