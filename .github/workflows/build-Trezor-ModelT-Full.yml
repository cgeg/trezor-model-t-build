name: Build Trezor Model T Development Suite (No-Sig Test)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Ensure Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Inspect & Patch Bootloader Signature Check
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Searching Bootloader Verification Functions ==="
          grep -rn "verify\|signature\|check_firmware\|vendor" core/embed/projects/bootloader/ || true

          python3 -c '
          import glob, re

          # 僅針對 bootloader 專案資料夾進行精準修改，不碰共用底層以免影響 boardloader
          bl_files = glob.glob("core/embed/projects/bootloader/**/*.c", recursive=True)
          patched = 0

          for filepath in bl_files:
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              new_content = content
              # 將 bootloader 內部呼叫簽章或標頭檢查失敗的判斷條件替換為通過
              # 1. 常見寫法: if (sectrue != check_firmware_header(...)) 或 if (!check_...)
              new_content = re.sub(
                  r"if\s*\(\s*sectrue\s*!=\s*(check_[a-zA-Z0-9_]+|verify_[a-zA-Z0-9_]+)\s*\(",
                  r"if (secfalse == sectrue && sectrue != \1(",
                  new_content
              )
              new_content = re.sub(
                  r"if\s*\(\s*!\s*(check_[a-zA-Z0-9_]+|verify_[a-zA-Z0-9_]+)\s*\(",
                  r"if (0 && !\1(",
                  new_content
              )

              if new_content != content:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Safely patched condition in: {filepath}")
                  patched += 1

          print(f"Total bootloader files patched: {patched}")
          '

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://nixos.org https://cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            connect-timeout = 30
            stalled-download-timeout = 120
            max-jobs = auto
            cores = 2
            fallback = true

      - name: Build Model T Development Suite
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Starting Trezor Model T Build ==="
          nix-shell --show-trace --run '
            set -euo pipefail
            echo "=== Boardloader: Development ==="
            uv run xtask build boardloader -m t2t1 --bootloader-devel

            echo "=== Bootloader: Development (No-Sig Patched) ==="
            uv run xtask build bootloader -m t2t1 --bootloader-devel

            echo "=== Firmware: Development ==="
            uv run xtask build firmware -m t2t1 --bootloader-devel

            echo "=== All Builds Completed ==="
          ' 2>&1 | tee build.log

      - name: Collect & Verify Binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="core/build/artifacts/T2T1"
          mkdir -p dist/boardloader
          mkdir -p dist/bootloader
          mkdir -p dist/firmware

          for file in boardloader bootloader firmware; do
            if [ ! -s "$SRC/$file.bin" ]; then
              echo "ERROR: Missing binary: $SRC/$file.bin"
              tail -n 50 build.log || true
              exit 1
            fi
          done

          cp "$SRC/boardloader.bin" dist/boardloader/
          cp "$SRC/bootloader.bin" dist/bootloader/
          cp "$SRC/firmware.bin" dist/firmware/

          ls -lhR dist/
          sha256sum \
            dist/boardloader/boardloader.bin \
            dist/bootloader/bootloader.bin \
            dist/firmware/firmware.bin \
            | tee dist/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-nosig-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
