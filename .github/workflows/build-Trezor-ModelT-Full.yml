
name: Build Trezor Model T Dev Suite (Non-Production)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive

      - name: Ensure Submodules
        run: git submodule update --init --recursive --force

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Build Model T Non-Production
        run: |
          set -euo pipefail

          nix-shell --run '
            set -euo pipefail

            echo "=== Build Boardloader ==="
            uv run xtask build boardloader -m t2t1

            echo "=== Build Development Bootloader ==="
            uv run xtask build bootloader -m t2t1 --bootloader-devel

            echo "=== Build Firmware ==="
            uv run xtask build firmware -m t2t1
          '

      - name: Collect & Verify Binaries
        run: |
          set -euo pipefail

          SRC="core/build/artifacts/T2T1"

          mkdir -p dist/boardloader
          mkdir -p dist/bootloader
          mkdir -p dist/firmware

          for file in boardloader bootloader firmware; do
            if [ ! -s "$SRC/$file.bin" ]; then
              echo "ERROR: Missing binary: $SRC/$file.bin"
              exit 1
            fi
          done

          cp "$SRC/boardloader.bin" dist/boardloader/
          cp "$SRC/bootloader.bin" dist/bootloader/
          cp "$SRC/firmware.bin" dist/firmware/

          echo "=== Model T Non-Production Binaries ==="
          ls -lhR dist/

          echo "=== SHA256 Verification ==="
          sha256sum \
            dist/boardloader/boardloader.bin \
            dist/bootloader/bootloader.bin \
            dist/firmware/firmware.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-dev-suite
          path: dist/
          if-no-files-found: error
          retention-days: 14
