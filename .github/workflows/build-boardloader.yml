name: Build Trezor Model T Boardloader

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive

      - name: Ensure Submodules
        run: git submodule update --init --recursive --force

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build Boardloader (Non-Production)
        run: |
          nix-shell --run "
            export PRODUCTION=0
            uv run xtask build boardloader -m t2t1
          "

      - name: Find & Verify Boardloader
        run: |
          echo "=== 尋找編譯產出的 boardloader.bin ==="
          find core/build* -type f -name '*boardloader*.bin' -exec ls -lh {} +
          mkdir -p dist
          find core/build* -type f -name '*boardloader*.bin' -exec cp {} dist/ \;
          echo "=== 準備上傳的檔案 ==="
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-boardloader
          path: dist/
          if-no-files-found: error
          retention-days: 14
