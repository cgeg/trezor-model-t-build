name: Build Trezor Model T Boardloader

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Trezor Firmware
        uses: actions/checkout@v4
        with:
          repository: trezor/trezor-firmware
          ref: main
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build Boardloader (Non-Production)
        run: |
          nix-shell --run "
            export PRODUCTION=0
            uv sync &&
            uv run xtask build boardloader -m t2t1
          "

      - name: Verify Build Output
        run: |
          ls -lh core/build-xtask/artifacts/T2T1/
          find core/build-xtask -type f -iname '*boardloader*.bin'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trezor-model-t-boardloader
          path: core/build-xtask/artifacts/T2T1/
          if-no-files-found: error
          retention-days: 14
